{% extends 'base.html' %}{% block title %}{{ game.title }}{% endblock %}{% block extra_css %}<style>.play-page{max-width:760px;margin:42px auto;padding:0 16px 40px}.play-card{position:relative;overflow:hidden;padding:30px;border-radius:24px;border:1px solid #dce6f8;background:white;box-shadow:0 24px 60px #1d4ed822;text-align:center;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}.play-card:before{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:#dbeafe70;right:-100px;top:-150px;animation:spin 16s linear infinite}.play-icon{position:relative;display:inline-grid;place-items:center;width:104px;height:104px;border-radius:30px;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-size:57px;animation:bob 2.5s ease-in-out infinite}.play-card h1{position:relative;color:#173b78}.play-prompt{position:relative;padding:20px;border-radius:15px;background:#f5f8ff;font-size:1.22rem;font-weight:800;color:#172554}.answer-list{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:19px}.answer-option{display:block;padding:13px;border:1px solid #dbe5f5;border-radius:12px;cursor:pointer;text-align:left;transition:.2s}.answer-option:hover{transform:translateY(-2px);border-color:#2563eb;background:#eff6ff}.answer-option input{accent-color:#2563eb;margin-right:9px}.answer-text{position:relative;width:100%;box-sizing:border-box;margin:16px 0;padding:15px;border:1px solid #dbe5f5;border-radius:12px;font-size:1.1rem;text-transform:uppercase}.submit-answer{position:relative;width:100%;margin-top:17px;padding:14px;border:0;border-radius:12px;color:#fff;background:linear-gradient(95deg,#2563eb,#7c3aed);font-weight:800;cursor:pointer;box-shadow:0 10px 20px #4f46e533;transition:.2s}.submit-answer:hover{transform:translateY(-2px);filter:brightness(1.08)}.back-link{display:inline-block;margin-top:15px;color:#2563eb;text-decoration:none}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.play-card{padding:22px}.answer-list{grid-template-columns:1fr}}</style>{% endblock %}{% block content %}<main class="play-page"><section class="play-card"><div class="play-icon">{{ game.icon }}</div><h1>{{ game.title }}</h1><div class="play-prompt">{{ challenge.prompt }}</div><form method="post" action="{{ url_for('game_answer') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="token" value="{{ challenge.token }}">{% if choices %}<div class="answer-list">{% for choice in choices %}<label class="answer-option"><input type="radio" name="answer" value="{{ choice }}" required>{{ choice }}</label>{% endfor %}</div>{% else %}<input class="answer-text" name="answer" required autocomplete="off" placeholder="Javobni yozing">{% endif %}<button class="submit-answer">Javobni yuborish · +15 XP</button></form><a class="back-link" href="{{ url_for('games') }}">← O‘yinlarga qaytish</a></section></main>{% endblock %}
