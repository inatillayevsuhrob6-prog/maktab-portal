<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maktab Portal - Ro‘yxatdan o‘tish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Yangi Maktab Qo‘shish</h2>
            <p>Platformaga qo‘shilish uchun ma'lumotlarni kiriting</p>
            
            <!-- CSRF TOKEN QO'SHILDI -->
            <form action="/register" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="input-group">
                    <label>Maktab Nomi</label>
                    <input type="text" name="school_name" placeholder="Masalan: 24-sonli maktab" required>
                </div>

                <div class="input-group">
                    <label>Manzil</label>
                    <input type="text" name="address" placeholder="Toshkent sh..." required>
                </div>

                <div class="input-group">
                    <label>Telefon</label>
                    <input type="text" name="phone" placeholder="+998..." required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="maktab@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Login (Admin uchun)</label>
                    <input type="text" name="login" placeholder="Login tanlang" required>
                </div>
                
                <div class="input-group">
                    <label>Parol</label>
                    <input type="password" name="password" placeholder="Xavfsiz parol" required>
                </div>
                
                <button type="submit" class="btn-primary">Ro‘yxatdan o‘tish</button>
            </form>
            
            <div class="footer-link">
                <a href="/">Kirish sahifasiga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
