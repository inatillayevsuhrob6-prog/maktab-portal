<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangiliklar Boshqaruvi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .page-navbar { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 30px; }
        .form-row textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; min-height: 100px; }
        .news-item { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #3498db; display: flex; gap: 15px; align-items: start; }
        .news-thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: #eee; flex-shrink: 0; }
        .file-input-wrapper { margin-bottom: 15px; border: 2px dashed #cbd5e1; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .file-input-wrapper:hover { border-color: #3498db; background: #f8fafc; }
    </style>
</head>
<body style="background:#f4f6f9; padding:20px;">
    <div class="page-navbar">
        <h3>Yangiliklar va E'lonlar</h3>
        <a href="/dashboard" style="color:white; text-decoration:none;">← Dashboard</a>
    </div>

    <div style="max-width:800px; margin:0 auto;">
        <div class="card" style="margin-bottom: 30px; padding:20px; background:white; border-radius:8px;">
            <h4 style="margin-top:0;">Yangi Xabar Qo‘shish</h4>
            <!-- enctype="multipart/form-data" qo'shildi (rasm yuklash uchun shart!) -->
            <form action="/news/add" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <input type="text" name="title" placeholder="Sarlavha" required style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:4px;">
                <textarea name="content" placeholder="Xabar matni..." required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; min-height:100px;"></textarea>
                
                <!-- YANGI: Fayl tanlash maydoni -->
                <div class="file-input-wrapper">
                    <label for="news_image" style="cursor:pointer; display:block;">
                        <span style="font-size:2rem;">📷</span><br>
                        <strong>Rasm yuklash</strong><br>
                        <small style="color:#64748b;">JPG, PNG (Max 2MB)</small>
                    </label>
                    <input type="file" id="news_image" name="news_image" accept="image/*" style="display:none;" onchange="alert('Rasm tanlandi!')">
                </div>
                
                <label style="display:flex; align-items:center; gap:10px; margin-bottom:15px; cursor:pointer;">
                    <input type="checkbox" name="is_announcement" style="width:18px; height:18px;">
                    <span>Bu muhim e'lon</span>
                </label>
                <button type="submit" class="btn-primary">Joylash</button>
            </form>
        </div>

        <h3 style="color:#2c3e50; margin-bottom:20px;">Mavjud Xabarlar</h3>
        {% for n in news %}
        <div class="news-item">
            {% if n.image_url %}
                <img src="{{ n.image_url }}" class="news-thumb">
            {% else %}
                <div class="news-thumb" style="display:flex; align-items:center; justify-content:center; font-size:2rem;">📰</div>
            {% endif %}
            <div style="flex:1;">
                <h4 style="margin:0 0 5px; color:#2c3e50;">{{ n.title }}</h4>
                <p style="color:#555; margin:0 0 10px; font-size:0.9rem;">{{ n.content[:100] }}...</p>
                <small style="color:#95a5a6;">{{ n.created_at.strftime('%d.%m.%Y') }}</small>
            </div>
            <div style="display:flex; flex-direction:column; gap:5px;">
                <a href="/edit_news/{{ n.id }}" style="background:#f39c12; color:white; padding:5px 10px; border-radius:4px; text-decoration:none; font-size:12px; text-align:center;">Tahrirlash</a>
                <a href="/delete_news/{{ n.id }}" style="background:#e74c3c; color:white; padding:5px 10px; border-radius:4px; text-decoration:none; font-size:12px; text-align:center;" onclick="return confirm('O\'chirilsinmi?')">O'chirish</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
