<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Ichki Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #f8fafc; font-family: sans-serif; margin: 0; }
        .chat-wrapper { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #64748b; text-decoration: none; font-weight: 500; }
        .chat-box { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; height: 70vh; display: flex; flex-direction: column; }
        .chat-header { padding: 20px; background: #2563eb; color: white; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .msg.sent { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.received { background: white; color: #1e293b; align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 1rem; transition: 0.2s; }
        .input-area input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .input-area button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .input-area button:hover { background: #1d4ed8; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <a href="/dashboard" class="back-link">← Ortga</a>
        
        <div class="chat-box">
            <div class="chat-header">💬 Ichki Chat</div>
            <div class="messages-area" id="messages">
                <div class="msg received">Salom! Sizga qanday yordam bera olaman?</div>
            </div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Xabar yozing..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()">Yuborish</button>
            </div>
        </div>
    </div>

    <script>
    function sendMsg() {
        const input = document.getElementById('msgInput');
        const msg = input.value.trim();
        if (!msg) return;
        
        const messagesDiv = document.getElementById('messages');
        
        // User message
        const userMsg = document.createElement('div');
        userMsg.className = 'msg sent';
        userMsg.textContent = msg;
        messagesDiv.appendChild(userMsg);
        
        input.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // Auto reply simulation
        setTimeout(() => {
            const reply = document.createElement('div');
            reply.className = 'msg received';
            reply.textContent = 'Xabaringiz qabul qilindi! (Demo rejim)';
            messagesDiv.appendChild(reply);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 800);
    }
    </script>
</body>
</html>
