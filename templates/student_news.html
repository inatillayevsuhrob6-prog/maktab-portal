<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangiliklar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .news-feed { max-width: 800px; margin: 0 auto; }
        .news-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .news-card.highlight { border-top: 4px solid #e74c3c; }
        .news-date { font-size: 12px; color: #95a5a6; margin-bottom: 8px; }
        .news-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .news-text { color: #555; line-height: 1.6; }
    </style>
</head>
<body style="background:#f4f6f9">
    <div class="dashboard-container" style="padding:20px">
        <nav class="navbar" style="border-radius:8px; margin-bottom:20px; max-width:800px; margin-left:auto; margin-right:auto;">
            <h3>Maktab Yangiliklari</h3>
            <a href="/student_dashboard" style="color:white; text-decoration:none">← Kabinetga</a>
        </nav>
        
        <div class="news-feed">
            {% for n in news %}
            <div class="news-card {% if n.is_announcement %}highlight{% endif %}">
                <div class="news-date">{{ n.created_at.strftime('%d %B, %Y') }}</div>
                <div class="news-title">{{ n.title }}</div>
                <div class="news-text">{{ n.content }}</div>
            </div>
            {% endfor %}
            {% if not news %}
            <div class="news-card" style="text-align:center; color:#777;">
                Hozircha yangiliklar yo'q.
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
