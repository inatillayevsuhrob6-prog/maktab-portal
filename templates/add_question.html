<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Savol Qo‘shish - {{ test.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="legacy-admin-page">
     {% include "admin_sidebar.html" %}
    <div class="dashboard-container">
        <nav class="navbar">
            <h3>{{ test.title }} - Savol Qo‘shish</h3>
            <a href="/tests" style="color:white; text-decoration:none;">Tugatish</a>
        </nav>
        <div class="content">
            <div class="card" style="max-width: 700px; margin: 0 auto; text-align: left;">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}<div style="margin-bottom:15px; padding:10px 14px; border-radius:8px; background:#dcfce7; color:#166534;">{{ message }}</div>{% endfor %}
                {% endwith %}
                <form action="/add_question/{{ test.id }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="input-group">
                        <label>Savol Matni</label>
                        <textarea name="question_text" rows="3" required style="width:100%; padding:10px; border:1px solid #ddd;"></textarea>
                    </div>
                    <div class="input-group"><label>A variant</label><input type="text" name="option_a" required></div>
                    <div class="input-group"><label>B variant</label><input type="text" name="option_b" required></div>
                    <div class="input-group"><label>C variant</label><input type="text" name="option_c" required></div>
                    <div class="input-group"><label>D variant</label><input type="text" name="option_d" required></div>
                    
                    <div class="input-group">
                        <label>To‘g‘ri Javob</label>
                        <select name="correct_answer" required style="width:100%; padding:10px;">
                            <option value="a">A</option>
                            <option value="b">B</option>
                            <option value="c">C</option>
                            <option value="d">D</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Mavzu (Tahlil uchun)</label>
                        <input type="text" name="topic" placeholder="Masalan: Kvadrat tenglamalar">
                    </div>
                    <div class="input-group">
                        <label>Submavzu</label>
                        <input type="text" name="subtopic" placeholder="Masalan: Diskriminant">
                    </div>

                    <button type="submit" class="btn-primary">Saqlash va Keyingi Savol</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
